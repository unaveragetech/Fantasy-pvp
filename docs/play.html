<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play Fantasy Athlete PvP</title>
<meta name="description" content="Play Fantasy Athlete PvP in your browser on iPhone, iPad, Mac, Windows or Android. Nothing to download.">
<meta name="theme-color" content="#0b1410">
<link rel="stylesheet" href="site.css">
<style>
  .play { min-height: 70vh; display: grid; place-content: center; gap: 14px; text-align: center; padding: 32px 16px; max-width: 520px; margin: auto; }
  .spin { width: 42px; height: 42px; margin: auto; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="site-header"></div>
<main><div class="play" role="status" aria-live="polite">
  <div class="spin" id="spin"></div>
  <h1 id="title">Finding the league…</h1>
  <p class="lead" id="msg" style="margin:auto">Nothing to download. You'll be in the game in a moment.</p>
  <div class="btns" id="btns" hidden style="justify-content:center"><button class="btn primary" id="retry">Try again</button><a class="btn" href="index.html">Back to the site</a></div>
</div></main>
<div id="site-footer"></div>
<script src="site.js"></script>
<script>
  // The game's address can change, so it's looked up fresh from the same place the Android app uses.
  var LOOKUP = 'https://gist.githubusercontent.com/unaveragetech/48bdf452322ef4595301f17fe62e8396/raw';
  var el = function (id) { return document.getElementById(id); };
  function timed(url, ms) {
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, ms);
    return fetch(url, { signal: c.signal, cache: 'no-store' }).finally(function () { clearTimeout(t); });
  }
  async function attempt() {
    var r = await timed(LOOKUP + '?t=' + Date.now(), 7000);
    var url = (await r.json()).url;
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) return null;
    var live = await timed(url + '/api/v1/games/football', 8000);
    return live.ok ? url : null;
  }
  async function go() {
    el('spin').hidden = false; el('btns').hidden = true;
    el('title').textContent = 'Finding the league…';
    el('msg').textContent = "Nothing to download. You'll be in the game in a moment.";
    for (var i = 0; i < 4; i++) {
      try { var url = await attempt(); if (url) { location.replace(url + '/' + location.hash); return; } } catch (e) { /* tries again */ }
      await new Promise(function (d) { setTimeout(d, 4000); });
    }
    el('spin').hidden = true; el('btns').hidden = false;
    el('title').textContent = 'The league is offline right now';
    el('msg').textContent = "This is an early beta running on a single computer, so it's sometimes down. Please try again soon.";
  }
  el('retry').addEventListener('click', go);
  go();
</script>
</body>
</html>
